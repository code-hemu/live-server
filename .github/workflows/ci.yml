name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint || true
    
    - name: Compile
      run: npm run compile
    
    - name: Run tests
      run: npm test || true
    
    - name: Prepare binaries
      run: npm run prepare-binaries || true
    
    - name: Package extensions
      run: npm run package-platforms || true
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: vsix-packages
        path: dist/*.vsix
